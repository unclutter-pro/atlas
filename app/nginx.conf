limit_req_zone $binary_remote_addr zone=atlas:10m rate=10r/s;

server {
    # listen on 0.0.0.0:8080 inside container; host-side binding
    # (127.0.0.1:8080:8080 in docker-compose.yml) restricts external access.
    listen 8080;
    server_name localhost;

    limit_req zone=atlas burst=20 nodelay;

    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # Chat: live SSE streams (no buffering, idle streams carry a keepalive
    # every 8s) and voice uploads with inline speech-to-text.
    location /ui/api/chat/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 26m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
