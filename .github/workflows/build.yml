name: build

# Version tags release an image. Manual runs only build, unless given a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (defaults to dry-run, which pushes nothing)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign (Sigstore OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: atlas
            context: .
          - image: atlas-stt
            context: stt
    env:
      IMAGE: ghcr.io/unclutter-pro/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.tag != '' }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push' || inputs.tag != ''

      - name: Sign image (keyless)
        if: github.event_name == 'push' || inputs.tag != ''
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
